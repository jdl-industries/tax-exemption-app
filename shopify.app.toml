# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4b8e37ee7c0518815c6003c7d33d1ace"
name = "JDL Tax Exemption"
application_url = "https://tax-exemption-service.jdlindustries.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products, customer_read_customers, customer_write_customers, read_customers, write_customers, write_files"
use_protected_customer_data_level = 1
protected_customer_data_access_reason = "To display and manage customer tax exemption metafields"

[auth]
redirect_urls = [
  "https://tax-exemption-service.jdlindustries.workers.dev/auth/callback",
  "https://tax-exemption-service.jdlindustries.workers.dev/auth/shopify/callback",
  "https://tax-exemption-service.jdlindustries.workers.dev/"
]

[customer.metafields.app.tax_exemption_type]
type = "single_line_text_field"
name = "Tax Exemption Type"
description = "The reason this customer is tax exempt"
access.customer_account = "read_write"
access.admin = "merchant_read_write"
[customer.metafields.app.tax_exemption_type.validations]
choices = [
  "Resale",
  "Government/Military (using Tax Free Credit Card)",
  "Government/Military (1094 required)",
  "Manufacturing/Industrial",
  "Other",
]

# File type metafield for the tax exemption certificate
[customer.metafields.app.tax_exemption_certificate]
type = "file_reference"
name = "Tax Exemption Certificate"
description = "Uploaded tax exemption document"
access.customer_account = "read_write"
access.admin = "merchant_read_write"

[customer.metafields.app.tax_exemption_certification_expiration]
type = "date"
name = "Tax Exemption Expiration"
description = "The date when the tax exemption certificate expires"
access.customer_account = "read_write"
access.admin = "merchant_read_write"

# Boolean type metafield for the attestation
[customer.metafields.app.tax_exemption_attestation]
type = "boolean"
name = "Tax Exemption Attestation"
description = "Customer confirmation of tax exempt status"
access.customer_account = "read_write"
access.admin = "merchant_read_write"

# ---------------------------------------------------------------------------
# B2B company location metafields.
#
# These mirror the customer metafields above so that a B2B contact who is a
# "Location admin" can maintain exemption documentation for the company
# location itself rather than for their personal customer record.
#
# The location's Tax ID is NOT a metafield -- it is the built-in
# CompanyLocation.taxSettings.taxRegistrationId, written through the worker
# with the companyLocationTaxSettingsUpdate mutation.
# ---------------------------------------------------------------------------

[company_location.metafields.app.tax_exemption_type]
type = "single_line_text_field"
name = "Tax Exemption Type"
description = "The reason this company location is tax exempt"
access.customer_account = "read_write"
access.admin = "merchant_read_write"
[company_location.metafields.app.tax_exemption_type.validations]
choices = [
  "Resale",
  "Government/Military (using Tax Free Credit Card)",
  "Government/Military (1094 required)",
  "Manufacturing/Industrial",
  "Other",
]

[company_location.metafields.app.tax_exemption_certificate]
type = "file_reference"
name = "Tax Exemption Certificate"
description = "Uploaded tax exemption document for this company location"
access.customer_account = "read_write"
access.admin = "merchant_read_write"

[company_location.metafields.app.tax_exemption_certification_expiration]
type = "date"
name = "Tax Exemption Expiration"
description = "The date when this company location's exemption certificate expires"
access.customer_account = "read_write"
access.admin = "merchant_read_write"

[company_location.metafields.app.tax_exemption_attestation]
type = "boolean"
name = "Tax Exemption Attestation"
description = "Company location admin confirmation of tax exempt status"
access.customer_account = "read_write"
access.admin = "merchant_read_write"
